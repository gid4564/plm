<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t d">
  <title id="t">PLM</title>
  <desc id="d">Product lifecycle management — a revision cycle around a part</desc>

  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d8bf5"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <!-- Rounded square rather than MOS's hex fastener: this system governs the
       record of a part, not the making of one. Stroked with the same paint so
       the corners soften without a second shape. -->
  <rect x="8" y="8" width="48" height="48" rx="13"
        fill="url(#badge)" stroke="url(#badge)" stroke-width="4"/>

  <!-- A lifecycle: a near-closed loop with an arrowhead, around a part mark.
       Drawn as strokes rather than filled glyphs — no font dependency, and the
       weight stays even down to a 16px favicon. The gap and the arrow are what
       make it read as a cycle rather than a ring at small sizes. -->
  <path d="M44 24.5 A15 15 0 1 1 32 17"
        fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M38.5 17.5 L44.5 24.5 L37 27"
        fill="none" stroke="#fff" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The part being governed: a small solid block at the centre of the cycle. -->
  <rect x="26" y="26" width="12" height="12" rx="2.5" fill="#fff"/>
</svg>
